name: Java Maven Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  APP_ENV: Development

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build
      run: mvn clean compile

  test:

    needs: build

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Test
      run: mvn test

  deploy:

    needs: test

    runs-on: ubuntu-latest

    steps:

    - name: Deployment message
      run: echo "Deploying application to $APP_ENV"
